services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  backend:
    build: ./erp-backend
    container_name: erp_backend
    restart: always

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:secret@db:5432/app_db
      PYTHONPATH: /app

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./erp-backend:/app

    working_dir: /app

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    networks:
      - app-network

  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile.dev

    container_name: erp_frontend

    ports:
      - "8080:5173"

    volumes:
      - ./erp-frontend:/app
      - /app/node_modules

    command: npm run dev -- --host

    depends_on:
      - backend

    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge