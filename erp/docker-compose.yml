services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - app-network

  backend:
    build:
      context: ./erp-backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONPATH: /app
      ENVIRONMENT: development

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./erp-backend:/app

    working_dir: /app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - app-network
      - shared-network

  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    environment:
      NODE_ENV: development

    volumes:
      - ./erp-frontend:/app
      - /app/node_modules

    command: npm run dev -- --host

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - shared-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
    internal: true

  shared-network:
    external: true