services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    command: npm run dev -- --host 0.0.0.0

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - shared-network

networks:
  shared-network:
    external: true